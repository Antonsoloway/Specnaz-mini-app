name: Mini App Pages publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: miniapp-pages
  cancel-in-progress: false

jobs:
  application-regressions:
    uses: ./.github/workflows/sosiska.yml

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-release.cjs app

  publish:
    needs: [release-gate, application-regressions]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public Mini App
        uses: actions/checkout@v4

      - name: Stage only public web assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_site
          find . -maxdepth 1 -type f \( \
            -name '*.html' -o -name '*.js' -o -name '*.css' -o \
            -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o \
            -name '*.webp' -o -name '*.svg' -o -name '*.gif' -o \
            -name '*.ico' -o -name '*.woff' -o -name '*.woff2' -o \
            -name '*.webmanifest' -o -name '.nojekyll' \
          \) -exec cp -- {} _pages_site/ \;
          if [ -d assets ]; then cp -a assets _pages_site/assets; fi
          test -s _pages_site/index.html
          test -s _pages_site/app.html
          test -s _pages_site/app-v0617.html
          test -s _pages_site/music-playlist-v061.js
          grep -Fq '20261116-v0617-music-compat1' _pages_site/app-v0617.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Mini App
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages_site
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the current attempt artifact to be visible
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                name
              });
              const matches = data.artifacts.filter(item => item.name === name && !item.expired);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error(`Ambiguous current release artifact: ${name}`);
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error(`Current release artifact did not become visible: ${name}`);

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
