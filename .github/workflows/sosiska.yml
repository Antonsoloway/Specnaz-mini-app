name: Sosiska module
on:
  push:
    branches: [main, 'sosiska-*']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sosiska-*.test.mjs
      - run: node --test tests/admin-write-timeout-v0600.test.js tests/admin-data-client-v0600.test.js tests/admin-media-save-speed.test.js
      - run: npx --yes esbuild@0.25.12 worker/src/sosiska-period.js --bundle --format=iife --global-name=SosiskaPeriod --outfile=/tmp/sosiska-period-v061.js && cmp /tmp/sosiska-period-v061.js sosiska-period-v061.js
      - run: node --check sosiska-v061.js && node --check transport-v0514.js
      - run: npx --yes esbuild@0.25.12 worker/src/entry-v1420.js --bundle --format=esm --platform=browser --outfile=/tmp/sosiska-worker.js
      - run: npm install --prefix /tmp/sosiska-runtime --no-audit --no-fund miniflare@5.20261006.1-alpha
      - run: node tests/verify-sosiska-workerd.mjs /tmp/sosiska-runtime/package.json /tmp/sosiska-worker.js
      - run: npx --yes esbuild@0.25.12 worker/src/entry-v1410.js --bundle --format=esm --platform=browser --outfile=/tmp/sosiska-legacy-worker.js
      - run: node tests/verify-sosiska-isolation-workerd.mjs /tmp/sosiska-runtime/package.json /tmp/sosiska-legacy-worker.js /tmp/sosiska-worker.js
      - run: npm install --prefix /tmp/sosiska-browser --no-audit --no-fund playwright@1.62.1
      - run: /tmp/sosiska-browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - run: node tests/verify-team-loading-browser.cjs && node tests/verify-team-title-browser.cjs && node tests/verify-emblems-browser.cjs && node tests/verify-team-live-browser.cjs && node tests/verify-team-card-repair-browser.cjs && node tests/verify-team-cache-browser.cjs && node tests/verify-team-emoji-browser.cjs && node tests/verify-team-emblem-display-browser.cjs && node tests/verify-sosiska-membership-browser.cjs && node tests/verify-admin-sequential-save-browser.cjs && node tests/verify-sosiska-readability-browser.cjs
        env:
          NODE_PATH: /tmp/sosiska-browser/node_modules
