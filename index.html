<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>ЧП — Mini App</title>
  <link rel="stylesheet" href="style.css?v=0.5.8" />
  <link rel="stylesheet" href="team-photo-fix.css?v=0.5.8" />
  <link rel="stylesheet" href="profile-card.css?v=0.5.8" />
  <link rel="stylesheet" href="specnaz.css?v=0.5.8" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="avatar" id="avatar">🕊️</div>
      <div>
        <div class="eyebrow">ЧАТ ПОБЕДИТЕЛЕЙ</div>
        <h1 id="hello">Привет!</h1>
        <div class="muted" id="userMeta">Проверяем доступ…</div>
      </div>
    </header>

    <section class="status-card">
      <div>
        <strong>ЧП Mini App</strong>
        <div class="muted" id="authStatus">Авторизация Telegram</div>
      </div>
      <span class="badge" id="versionBadge">v0.5.8</span>
    </section>

    <section class="grid">
      <button class="tile" data-page="players"><span>👥</span><b>Участники</b><small>Поиск и профили</small></button>
      <button class="tile" data-page="teams"><span>🏰</span><b>Команды</b><small>Список и карточки</small></button>
      <button class="tile accent" data-page="help"><span>🚨</span><b>Спецназ</b><small>Герои и история</small></button>
      <button class="tile" data-page="projects"><span>📢</span><b>Проекты</b><small>Маяк и другие</small></button>
    </section>

    <section class="panel" id="panel">
      <h2>Проверяем доступ</h2>
      <p>Подтверждаем Telegram-пользователя и ищем его в Royal CRM.</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" data-page="home">🏠<span>Главная</span></button>
    <button class="nav" data-page="players">👥<span>Люди</span></button>
    <button class="nav" data-page="teams">🏰<span>Команды</span></button>
    <button class="nav" data-page="help">🚨<span>Спецназ</span></button>
    <button class="nav" data-page="profile">👤<span>Я</span></button>
  </nav>

  <script src="fallback-transport.js?v=0.5.8"></script>
  <script src="app.js?v=0.5.8"></script>
  <script src="team-identity-fix.js?v=0.5.8"></script>
  <script src="media-fix.js?v=0.5.8"></script>
  <script src="profile-card.js?v=0.5.8"></script>
  <script src="specnaz.js?v=0.5.8"></script>
</body>
</html>
