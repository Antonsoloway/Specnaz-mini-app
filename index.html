<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17212b" />
  <title>ЧП — Mini App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="avatar" id="avatar">🕊️</div>
      <div>
        <div class="eyebrow">ЧАТ ПОБЕДИТЕЛЕЙ</div>
        <h1 id="hello">Привет!</h1>
        <div class="muted" id="userMeta">Открыто вне Telegram</div>
      </div>
    </header>

    <section class="status-card">
      <div>
        <strong>ЧП Mini App</strong>
        <div class="muted">Начальная версия</div>
      </div>
      <span class="badge">v0.1</span>
    </section>

    <section class="grid">
      <button class="tile" data-page="players"><span>👥</span><b>Участники</b><small>Поиск и профили</small></button>
      <button class="tile" data-page="teams"><span>🏰</span><b>Команды</b><small>Список и карточки</small></button>
      <button class="tile accent" data-page="help"><span>🚨</span><b>Спецназ</b><small>Помощь командам</small></button>
      <button class="tile" data-page="projects"><span>📢</span><b>Проекты</b><small>Маяк и другие</small></button>
    </section>

    <section class="panel" id="panel">
      <h2>Готово к подключению</h2>
      <p>Интерфейс работает. Следующий этап — подключение Royal CRM, локального снимка данных и ролей Telegram.</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active" data-page="home">🏠<span>Главная</span></button>
    <button class="nav" data-page="players">👥<span>Люди</span></button>
    <button class="nav" data-page="teams">🏰<span>Команды</span></button>
    <button class="nav" data-page="help">🚨<span>Спецназ</span></button>
    <button class="nav" data-page="profile">👤<span>Я</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
