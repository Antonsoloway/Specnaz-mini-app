name = "royal-crm-miniapp-api"
main = "src/entry-v1410.js"
compatibility_date = "2026-08-15"

[vars]
FRONTEND_ORIGIN = "https://antonsoloway.github.io"
DATA_REPO = "Antonsoloway/royal-crm-data"
DATA_BRANCH = "main"
DATA_PATH = "snapshot.json"
ADMIN_DATA_PATH = "admin-snapshot.json"
ACHIEVEMENTS_PATH = "achievements.json"
TELEGRAM_CHAT_ID = "-1002109152418"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Secrets stay in Cloudflare Variables and Secrets:
# BOT_TOKEN
# GITHUB_TOKEN
# SESSION_SECRET
# BOT_TOKEN is also used server-side as the HMAC key for Worker -> Apps Script
# admin-write requests and short-lived Google Sheets CellImage source URLs.
# It is never exposed to the browser or GitHub.
#
# entry-v1330 bypasses the old nested /snapshot wrapper fan-out: it verifies
# the existing Worker session once, reads the shared private snapshot cache
# once, then sanitizes a Telegram-ID-based public snapshot directly.
#
# entry-v1340 applies the same repaired snapshot authorization path to
# /admin-data, then performs the fresh Telegram admin check and private admin
# snapshot read before exposing write.5 permissions.
#
# entry-v1360 keeps the privacy-aware /contact-by-id behavior and entry-v1370
# keeps its plain-DM fallback when Telegram rejects a direct profile button.
#
# entry-v1380 is the admin reliability layer. /admin-write no longer performs
# the old duplicated /admin-data authorization fan-out before every mutation:
# it verifies the Worker session once, caches the fresh Telegram admin check
# briefly, loads the private admin snapshot once, guarantees CORS-safe errors,
# and retries only transient Worker->Apps Script transport failures using the
# same requestId. /admin-team-photo also bypasses per-image /admin-data fan-out
# and reads private team media directly after the same cached admin check.
# It additionally supports the historical name-only media hash so old cached
# team images remain visible even when the newer name+game media file and the
# admin snapshot photoUrl are absent.
#
# entry-v1390 adds authenticated access to the five additional v0.6.1
# background-music files stored only in the private data repository. The
# existing MAYAK background media route remains unchanged; the frontend uses a
# shuffle-bag so all six tracks play in randomized order without immediate
# repeats across playlist cycles.
#
# entry-v1410 owns the v0.6.1 achievement registry. /snapshot and /admin-data
# receive a sanitized achievements[] projection; authenticated chat admins can
# update awards via /admin-achievements. Every real award add/remove is written
# atomically with the private registry journal and merged into the ordinary
# admin journal as schema-v2 participant changes. The first catalog item is
# MAYAK and the registry remains seeded from the historical project members.
#
# Cloudflare Builds source: GitHub main, root path /worker.
