name = "royal-crm-miniapp-api"
main = "src/entry-v122.js"
compatibility_date = "2026-08-15"

[vars]
FRONTEND_ORIGIN = "https://antonsoloway.github.io"
DATA_REPO = "Antonsoloway/royal-crm-data"
DATA_BRANCH = "main"
DATA_PATH = "snapshot.json"
TELEGRAM_CHAT_ID = "-1002109152418"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Secrets stay in Cloudflare Variables and Secrets:
