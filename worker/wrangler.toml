name = "royal-crm-miniapp-api"
main = "src/entry-v1240.js"
compatibility_date = "2026-08-15"

[vars]
FRONTEND_ORIGIN = "https://antonsoloway.github.io"
DATA_REPO = "Antonsoloway/royal-crm-data"
DATA_BRANCH = "main"
DATA_PATH = "snapshot.json"
ADMIN_DATA_PATH = "admin-snapshot.json"
TELEGRAM_CHAT_ID = "-1002109152418"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Secrets stay in Cloudflare Variables and Secrets:
# BOT_TOKEN
# GITHUB_TOKEN
# SESSION_SECRET
# BOT_TOKEN is also used server-side as the HMAC key for Worker -> Apps Script
# admin-write requests and short-lived Google Sheets CellImage source URLs.
# It is never exposed to the browser or GitHub.
#
# entry-v1240 keeps the stable public /team-photo route and adds an admin-only
# private snapshot fallback for inactive/hidden teams. Media identity remains
# SHA-256(name + game), while browser persistence stays in royal-crm-media-cache.
# Cloudflare Builds source: GitHub main, root path /worker.
