name = "royal-crm-miniapp-api"
main = "src/entry-v1320.js"
compatibility_date = "2026-08-15"

[vars]
FRONTEND_ORIGIN = "https://antonsoloway.github.io"
DATA_REPO = "Antonsoloway/royal-crm-data"
DATA_BRANCH = "main"
DATA_PATH = "snapshot.json"
ADMIN_DATA_PATH = "admin-snapshot.json"
TELEGRAM_CHAT_ID = "-1002109152418"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# Secrets stay in Cloudflare Variables and Secrets:
# BOT_TOKEN
# GITHUB_TOKEN
# SESSION_SECRET
# BOT_TOKEN is also used server-side as the HMAC key for Worker -> Apps Script
# admin-write requests and short-lived Google Sheets CellImage source URLs.
# It is never exposed to the browser or GitHub.
#
# entry-v1270 keeps every entry-v1260 route and accepts only an exact endpoint
# pinned by Script Property or installer-injected deployment configuration.
# This prevents ScriptApp.getService().getUrl() from advertising a stale /exec
# without depending on transient Google storage during rollout.
# Protected /admin-team-photo still covers active/paused/inactive teams.
# Media identity remains SHA-256(name + game); browser persistence stays in
# royal-crm-media-cache.
# Cloudflare Builds source: GitHub main, root path /worker.
#
# entry-v1290 preserves the v1.28 signed background snapshot refresh, adds the
# authenticated v0.6 background-music asset, and keeps the Apps Script one-off
# clock trigger plus unified five-minute trigger as durable fallbacks.
#
# entry-v1310 keeps all existing routes and adds a narrow authenticated avatar
# fallback: when an allowed in-chat participant has no avatarFileId in the
# snapshot, Worker asks Telegram getUserProfilePhotos/getFile on demand and
# proxies the image bytes server-side after the protected snapshot allow-list.
#
# entry-v1320 additionally checks the private data-repo last-known avatar
# registry before live Bot API lookup. This preserves historical file_id values
# for participants whose daily getUserProfilePhotos refresh currently returns
# USER_NOT_FOUND, without exposing private IDs/file IDs in the public repo.
